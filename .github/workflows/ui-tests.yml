name: Dojocover Multiple Sign-in Tests

on:
  push:
    branches:
      - master
      - qa-branch

  pull_request:

  schedule:
    - cron: '45 4 * * *'   # 10:15 AM IST

  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to Run'
        default: 'src/test/resources/suites/dataDrivenTest.xml'
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: dojocover-ui/pom.xml

      - name: Run Suite
        working-directory: dojocover-ui
        run: >
          mvn -B clean test
          -DtestSuite=${{ inputs.suite || 'src/test/resources/suites/dataDrivenTest.xml' }}
          -Dheadless=true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          retention-days: 10
          path: |
            dojocover-ui/target/surefire-reports
            dojocover-ui/target/logs
            dojocover-ui/test-output
            dojocover-ui/screenshots
